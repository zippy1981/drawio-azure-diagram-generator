[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "azdiagram"
version = "0.1.0"
description = "Render a YAML description of Azure infrastructure as a draw.io diagram"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "jsonschema>=4.18"]

[project.optional-dependencies]
test = ["pytest>=8"]
lint = ["ruff==0.16.8"]

[project.scripts]
azdiagram = "azdiagram.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/azdiagram"]

[tool.hatch.build.targets.wheel.force-include]
"schema/azure-diagram.schema.json" = "azdiagram/azure-diagram.schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
