# yaml-language-server: $schema=../schema/azure-diagram.schema.json
version: 1

diagram:
  title: Contoso AI platform
  showDescriptions: true
  direction: horizontal

external:
  - name: GitHub
    description: Source control and CI pipelines
    kind: saas
  - name: Customers
    description: Public users of the chat app
    kind: user

entra:
  name: Contoso tenant
  description: contoso.onmicrosoft.com
  domain: contoso.onmicrosoft.com
  servicePrincipals:
    - id: 358716e1-b5e8-513e-bc4e-4f41ff4a0fa7
      name: github-deploy
      description: Federated credential used by GitHub Actions
      kind: application
    - id: 0aebb844-c9c5-5b91-8bef-6660dd117246
      name: mi-chat-api
      description: User-assigned identity for the chat API
      kind: managedIdentity
  users:
    - id: 60808e72-fe32-5c81-89a5-3924edd986ba
      name: Alice Smith
      description: Platform lead
      userPrincipalName: alice@contoso.com
    - id: dcb714dd-2e41-5b1f-9187-489c56919d39
      name: Bob Jones
      description: Developer
  groups:
    - id: da234ac0-0964-52f1-9982-b5e0143b70c0
      name: Platform Engineers
      description: Contributor on the prod subscription
      owners:
        - ref: 60808e72-fe32-5c81-89a5-3924edd986ba
      members:
        - ref: dcb714dd-2e41-5b1f-9187-489c56919d39
        - ref: 358716e1-b5e8-513e-bc4e-4f41ff4a0fa7
        - type: user
          name: Carol (contractor)
          description: Guest account

graph:
  id: 86553a5e-593c-4cd1-bed6-f30bb24e37b2
  name: Microsoft Graph
  description: Mail and calendar for the support agent
  permissions: [Mail.Send (application), Calendars.Read (application)]

managementGroups:
  - id: f1ce00c0-d4cc-59d6-b96f-fed6fa042ded
    name: Contoso
    description: Root management group
    subscriptions:
      - id: e62370e3-2a09-55ba-943a-95ad492c1033
        name: Contoso Prod
        description: Production workloads
        resourceGroups:
          - id: bf7ea580-ced5-5af7-8b44-8ffff74a89df
            name: rg-chat-prod
            description: Chat application
            location: eastus2
            keyVaults:
              - id: c93fc6b3-285b-5db9-afd5-fffee0c3ac4c
                name: kv-chat-prod
                description: App secrets and API keys
            containerRegistries:
              - id: def48140-7106-53db-b2a2-6b8d25ff0368
                name: acrcontoso
                description: Shared image registry
                repositories:
                  - id: 2c9e4fdf-24f8-5922-ae9b-a2477638bc43
                    name: chat-api
                    description: Chat API image
                    imageTags: ["1.4.2", latest]
            containerApps:
              - id: 4d639f57-d445-506b-9334-ecc85a885e49
                name: ca-chat-api
                description: Public chat API
                ingress: external
                identity: 0aebb844-c9c5-5b91-8bef-6660dd117246
                containers:
                  - id: b9c33fa0-4850-5b40-953f-787955d1618c
                    name: chat-api
                    description: FastAPI service
                    imageRef: 2c9e4fdf-24f8-5922-ae9b-a2477638bc43
            storageAccounts:
              - id: 9cd90adf-0363-5007-9e9d-4c7d79936f8d
                name: stchatprod
                description: Conversation transcripts and uploads
                blobContainers:
                  - id: 17602173-d56f-5e52-98b0-c558d4b66e56
                    name: transcripts
                    description: Saved chat transcripts
                  - id: 2a973d39-85c5-546b-a0c2-c780f3d0c03c
                    name: uploads
                    description: User-uploaded files
            foundries:
              - id: 03d28565-9ffe-5254-8090-1b22e2fc42c6
                name: aif-chat-prod
                description: AI Foundry project for the chat app
                models:
                  - id: 1c2493c3-b22e-5a8a-8c07-7598854a6820
                    name: gpt-chat
                    description: Primary chat model
                    model: gpt-4.1
                    sku: GlobalStandard
                    capacity: 100
                agents:
                  - id: 5e788329-7afa-59ef-8631-680c64f1cce1
                    name: Support agent
                    description: Answers customer questions
                    model: 1c2493c3-b22e-5a8a-8c07-7598854a6820
                    connectors:
                      - id: f515c8b7-1a97-5a89-a154-79f7485db641
                        name: Docs search
                        description: Searches uploaded files
                        kind: fileSearch
                        target: 9cd90adf-0363-5007-9e9d-4c7d79936f8d
                      - id: 99855ac3-c17f-5c52-8b36-61a535386952
                        name: GitHub MCP
                        description: Reads issues for known bugs
                        kind: mcp
                        target: GitHub
                      - id: 553e0e3d-dc48-4116-9fff-202951af7717
                        name: Graph mail
                        description: Emails follow-ups to customers
                        kind: openapi
                        target: 86553a5e-593c-4cd1-bed6-f30bb24e37b2
            postgresServers:
              - id: 10fbb93a-dc8b-47d5-a4a6-24a435415e80
                name: psql-chat-prod
                description: Users and conversation metadata
                kind: flexibleServer
                version: "17"
                sku: GP_Standard_D4ds_v5
                databases:
                  - id: be853dd0-6245-4912-9615-b876925cd838
                    name: chat
                    description: App database
          - id: 2c619824-d7e3-46d3-9eff-39f851d688ab
            name: rg-data-prod
            description: Analytics and legacy data
            location: eastus2
            postgresServers:
              - id: b5de44f1-749d-492e-a5ca-61dd65d276b7
                name: cosmos-pg-analytics
                description: Distributed usage analytics
                kind: cosmosDb
              - id: 83b36fd2-c683-4cff-9447-445ba3e7fba2
                name: hdb-vectors
                description: Embeddings for semantic search
                kind: horizonDb
              - id: 84029c61-fc3f-40ff-bc80-a4491aa3fc8b
                name: psql-legacy-billing
                description: Pending migration to flexible server
                kind: singleServer
                version: "11"

connections:
  - from: Customers
    to: 4d639f57-d445-506b-9334-ecc85a885e49
    label: HTTPS
  - from: 4d639f57-d445-506b-9334-ecc85a885e49
    to: 5e788329-7afa-59ef-8631-680c64f1cce1
    label: invokes
  - from: 4d639f57-d445-506b-9334-ecc85a885e49
    to: c93fc6b3-285b-5db9-afd5-fffee0c3ac4c
    label: reads secrets
    style: dashed
  - from: GitHub
    to: def48140-7106-53db-b2a2-6b8d25ff0368
    label: pushes images
  - from: 4d639f57-d445-506b-9334-ecc85a885e49
    to: 10fbb93a-dc8b-47d5-a4a6-24a435415e80
    label: reads/writes
